---
layout: default
---

{% for post in site.posts %}
  <article class="post">
    <div class="post-header">
      <div class="post-avatar">P</div>
      <div class="post-meta">
        <a href="#">Your Name</a>
        <span>{{ post.date | date: "%B %d, %Y" }}</span>
      </div>
    </div>
    
    <h2 class="post-title">
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h2>
    
    <div class="post-body">
      {{ post.content }}
    </div>

    <div class="post-footer">
      <button class="action-btn" onclick="sharePost('{{ site.url }}{{ post.url }}', '{{ post.title }}')">Share</button>
    </div>
  </article>
{% endfor %}
